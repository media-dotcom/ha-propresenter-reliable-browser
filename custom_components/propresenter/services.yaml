show_message:
  name: Show message
  description: Show a ProPresenter message with optional dynamic token values. Use the message UUID or name to identify the message.
  fields:
    message:
      name: Message UUID or Name
      description: UUID or name of the message to show (e.g., "4e677061-f132-4f21-8ddf-84df5cf8a58a" or "Child message")
      required: true
      example: "Child message"
      selector:
        text:
          multiline: false
    tokens:
      name: Token values
      description: 'Token values as key-value pairs. For example, if your message has a "Name" token, enter: {"Name": "John Smith"}'
      required: false
      example: '{"Name": "John Smith"}'
      selector:
        object:

refresh_presentation_cache:
  name: Refresh presentation cache
  description: Refetch active presentation metadata and invalidate its thumbnail cache.

trigger_slide:
  name: Trigger slide
  description: Trigger one slide in the active ProPresenter presentation without changing the ProPresenter view context.
  target:
    entity:
      integration: propresenter
      domain: sensor
  fields:
    slide_index:
      name: Slide index
      description: The original 0-based ProPresenter slide index.
      required: true
      example: 5
      selector:
        number:
          min: 0
          step: 1
          mode: box
    expected_presentation_uuid:
      name: Expected presentation UUID
      description: Optional snapshot UUID used to reject a stale dashboard click.
      required: false
      selector:
        text:
    expected_metadata_revision:
      name: Expected metadata revision
      description: Optional opaque metadata revision paired with the expected UUID.
      required: false
      selector:
        text:

trigger_playlist_item:
  name: Trigger playlist item
  description: Make one selected ProPresenter presentation playlist item live without first focusing a library presentation.
  target:
    entity:
      integration: propresenter
      domain: sensor
  fields:
    playlist_uuid:
      name: Playlist UUID
      description: The UUID of the ProPresenter playlist containing the selected item.
      required: true
      selector:
        text:
    item_key:
      name: Playlist item key
      description: The stable occurrence key returned by the presentation browser.
      required: true
      selector:
        text:
    item_index:
      name: Playlist item index
      description: The original 0-based item index in the ProPresenter playlist.
      required: true
      selector:
        number:
          min: 0
          step: 1
          mode: box
    presentation_uuid:
      name: Presentation UUID
      description: The UUID of the presentation represented by the selected item.
      required: true
      selector:
        text:
    expected_playlist_revision:
      name: Expected playlist revision
      description: The opaque playlist revision captured when the item was selected.
      required: true
      selector:
        text:
